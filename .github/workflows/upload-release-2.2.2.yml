name: Upload verified 2.2.2 release files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload-release-2.2.2
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify published artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          curl --fail --location --retry 3 --max-time 600 \
            https://insane.insanehost.qzz.io/download/insane-client.apk \
            --output release-files/INSANE-CLIENT-2.2.2-android.apk
          curl --fail --location --retry 3 --max-time 600 \
            https://insane.insanehost.qzz.io/download/insane-client-source.zip \
            --output release-files/INSANE-CLIENT-2.2.2-source.zip
          cp docs/releases/SHA256SUMS-2.2.2.txt docs/releases/BUILD-REPORT-2.2.2.json docs/releases/LOGO-VERIFICATION-2.2.2.json release-files/
          cd release-files
          sha256sum --check SHA256SUMS-2.2.2.txt
      - name: Upload to the existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view v2.2.2 --json isDraft --jq .isDraft)" = true
          gh release upload v2.2.2 release-files/* --clobber
